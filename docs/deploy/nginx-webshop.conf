# Đặt vào /etc/nginx/sites-available/webshop
# Sau đó: certbot --nginx -d YOUR_DOMAIN sẽ bổ sung SSL.

server {
    listen 80;
    listen [::]:80;
    server_name gomsuluxury.vn www.gomsuluxury.vn;

    # Ẩn số phiên bản và tên OS trong header Server (nginx/1.18.0 (Ubuntu) → nginx).
    server_tokens off;

    client_max_body_size 21m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
