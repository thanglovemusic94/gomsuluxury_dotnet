# Deploy WebShop to Lightsail via SSH/rsync.
# Secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY, optional VPS_PORT

name: Deploy WebShop

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish
        run: dotnet publish WebShop/WebShop.csproj -c Release -o artifacts/publish

      - name: Bundle with Production config
        run: |
          mkdir -p artifacts/bundle
          cp -a artifacts/publish artifacts/bundle/WebShop
          cp -a ace artifacts/bundle/ace
          cp docs/deploy/appsettings.Production.json.example artifacts/bundle/WebShop/appsettings.Production.json

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Rsync to VPS
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT || 22 }}
        run: |
          set -euo pipefail
          rsync -az --delete \
            --exclude 'webshop.db' \
            --exclude 'webshop.db-shm' \
            --exclude 'webshop.db-wal' \
            --exclude 'wwwroot/uploads/' \
            --exclude 'wwwroot/is-cache/' \
            -e "ssh -p $PORT -o StrictHostKeyChecking=accept-new" \
            artifacts/bundle/WebShop/ \
            "$USER@$HOST:/var/www/webshop/WebShop/"
          rsync -az \
            -e "ssh -p $PORT -o StrictHostKeyChecking=accept-new" \
            artifacts/bundle/ace/ \
            "$USER@$HOST:/var/www/webshop/ace/"

      - name: Restart service
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT || 22 }}
        run: |
          ssh -p "$PORT" -o StrictHostKeyChecking=accept-new \
            "$USER@$HOST" "sudo systemctl restart webshop && sleep 2 && sudo systemctl is-active webshop"
